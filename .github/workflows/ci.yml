name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit & integration tests
        run: npm test

      - name: Build UI
        run: npm run build

      - name: Start TestForge
        run: |
          SEED_DEMO_RUNS=0 npm start > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/api/health > /dev/null && echo "TestForge is up" && exit 0
            sleep 1
          done
          echo "TestForge did not start in time"; cat server.log; exit 1

      # Example of gating a pipeline on a TestForge suite.
      - name: Run Smoke suite
        run: node cli/testforge.js run --suite "Smoke" --junit reports/junit.xml --html reports/report.html

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testforge-reports
          path: |
            reports/
            server.log
